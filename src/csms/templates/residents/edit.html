<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resident – {{ application_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="mgmt-container">

    <header class="mgmt-header">
        <h1>Edit Resident</h1>
        <a href="{{ url_for('residents.list_residents') }}" class="btn btn-secondary">← Back to Residents</a>
    </header>

    {% if errors %}
    <div class="alert alert-error">
        <strong>Please correct the following:</strong>
        <ul>
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <section class="form-card">
        <div class="readonly-info">
            <span class="readonly-label">Resident ID:</span>
            <span class="readonly-value">{{ resident.id }}</span>
            &nbsp;&nbsp;
            <span class="readonly-label">Status:</span>
            <span class="status-badge status-{{ resident.status | lower | replace(' ', '-') }}">
                {{ resident.status }}
            </span>
        </div>

        <form method="post" action="{{ url_for('residents.edit_submit', resident_id=resident.id) }}" novalidate>
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name"
                       value="{{ form_data.first_name | default(resident.first_name) }}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name"
                       value="{{ form_data.last_name | default(resident.last_name) }}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address"
                       value="{{ form_data.address | default(resident.address) }}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label for="contact_number">Contact Number</label>
                <input type="text" id="contact_number" name="contact_number"
                       value="{{ form_data.contact_number | default(resident.contact_number) }}"
                       class="form-control" placeholder="09XXXXXXXXX" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       value="{{ form_data.email | default(resident.email) }}"
                       class="form-control" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('residents.list_residents') }}" class="btn btn-link">Cancel</a>
            </div>
        </form>
    </section>

</div>
</body>
</html>
