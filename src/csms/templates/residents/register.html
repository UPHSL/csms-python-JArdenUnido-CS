<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Resident – {{ application_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="mgmt-container">

    <header class="mgmt-header">
        <h1>Register Resident</h1>
        <a href="{{ url_for('residents.list_residents') }}" class="btn btn-secondary">← Back to Residents</a>
    </header>

    {% if errors %}
    <div class="alert alert-error">
        <strong>Please correct the following:</strong>
        <ul>
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <section class="form-card">
        <form method="post" action="{{ url_for('residents.register_submit') }}" novalidate>
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name"
                       value="{{ form_data.first_name | default('') }}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name"
                       value="{{ form_data.last_name | default('') }}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address"
                       value="{{ form_data.address | default('') }}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label for="contact_number">Contact Number</label>
                <input type="text" id="contact_number" name="contact_number"
                       value="{{ form_data.contact_number | default('') }}"
                       class="form-control" placeholder="09XXXXXXXXX" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       value="{{ form_data.email | default('') }}"
                       class="form-control" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Register Resident</button>
                <a href="{{ url_for('residents.list_residents') }}" class="btn btn-link">Cancel</a>
            </div>
        </form>
    </section>

</div>
</body>
</html>
