<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>{{ application_name }}</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <main class="container">
        <section class="card">
            <p class="label">Programming Languages Laboratory</p>

            <h1>{{ application_name }}</h1>

            <p class="message">
                Starter application initialized successfully.
            </p>

            <dl class="details">
                <div>
                    <dt>Current Sprint</dt>
                    <dd>{{ current_sprint }}</dd>
                </div>

                <div>
                    <dt>Technology</dt>
                    <dd>Python with Flask</dd>
                </div>

                <div>
                    <dt>Version</dt>
                    <dd>v{{ application_version }}</dd>
                </div>
            </dl>

            <p class="status">
                Environment status: Ready
            </p>
        </section>
    </main>
    
    <footer class="app-footer">
        <p><strong>{{ application_name }}</strong> v{{ application_version }} — Final Release</p>
    </footer>
</body>
</html>
